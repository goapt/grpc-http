syntax = "proto3";

package demo.api.v1;

import "google/api/annotations.proto";
import "google/api/httpbody.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "gen/demo/v1;demo";

// User Service
service UserService {
  // List
  rpc List(ListRequest) returns (ListResponse) {
    option (google.api.http) = {get: "/article/list/{user_id}"};
  }
  // PUT
  rpc Put(ListRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/article/update"
      body: "*"
    };
  }
  // Create
  rpc Create(CreateRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/article/create"
      body: "*"
    };
  }
  // HTML
  rpc HTML(google.protobuf.Empty) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/article/html"};
  }
}

message User {
  int32 id = 1;
  string name = 2;
  string email = 3;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message CreateRequest {
  string name = 2;
  string email = 3;
}

message CreateResponse {
  int32 id = 1;
}

message PathRequest {
  string path = 1;
}

message ListRequest {
  int32 page = 1;
  int32 user_id = 2;
}

message ListResponse {
  repeated User results = 1;
}
